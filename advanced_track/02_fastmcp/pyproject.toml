[project]
name = "fastmcp-workshop"
version = "1.0.0"
description = "Praxisworkshop zu FastMCP und Streamable HTTP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
