[project]
name = "programmatic-tool-calling-workshop"
version = "0.1.0"
description = "Workshop track comparing classic tool calling with portable programmatic tool calling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.108.0",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.12.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
